name: Tests

# The manager runs on whatever Python and terminal a musician has: every
# push is checked on the three systems, at the oldest Python ESP-IDF 5.5
# accepts and a current one. The installers are parsed on their own systems.
on:
  push:
    paths: ['crosspad_app_manager.py', 'tests/**', 'install/**', '.github/workflows/test.yml']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -q pytest
      - run: python -m pytest tests -q
      - name: CLI answers without a terminal
        run: python -c "import crosspad_app_manager as c; print(c.MANAGER_VERSION)"
      - name: install.sh parses
        if: runner.os != 'Windows'
        run: bash -n install/install.sh
      - name: install.ps1 parses (Windows PowerShell 5.1 and 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          powershell -NoProfile -Command "`$e=`$null; [void][System.Management.Automation.Language.Parser]::ParseFile('$PWD\install\install.ps1',[ref]`$null,[ref]`$e); if (`$e) { `$e; exit 1 }"
